name: Supabase keep-alive

# Drži besplatni Supabase projekat budnim. Free projekat se pauzira posle
# ~7 dana neaktivnosti; ovo ga "lupne" 2x nedeljno (ponedeljak i četvrtak),
# pa razmak nikad ne pređe 7 dana.
on:
  schedule:
    - cron: '17 7 * * 1,4'   # pon i čet u 07:17 UTC
  workflow_dispatch:           # ručno pokretanje preko Actions taba

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (budi bazu)
        # anon key je javni klijentski ključ (ionako je u objavljenom kodu)
        env:
          SUPABASE_URL: https://fvjtklkcavzdaiivixkn.supabase.co
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2anRrbGtjYXZ6ZGFpaXZpeGtuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMjk5MTAsImV4cCI6MjA5MDgwNTkxMH0.9fykU3VN0Il0Q6JeT1DW7y6oZbzPs9VXGmcnYEWvIGY
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")
          echo "Supabase REST odgovorio: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Neočekivan status — baza možda spava ili je nedostupna."
            exit 1
          fi
          echo "Baza je budna ✅"
